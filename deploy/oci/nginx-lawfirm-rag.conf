# nginx reverse proxy for Law Firm RAG on an OCI VM.
#
# Install to /etc/nginx/conf.d/lawfirm-rag.conf (Oracle Linux) or
# /etc/nginx/sites-available/lawfirm-rag.conf (Ubuntu), replace
# rag.example.com, then run certbot for the TLS certs:
#   sudo certbot --nginx -d rag.example.com
#
# The app listens on 127.0.0.1:8000 only — nginx is the public entrypoint.

# --- HTTP: redirect everything to HTTPS (certbot will fill/grow this) -------
server {
    listen 80;
    listen [::]:80;
    server_name rag.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: the real proxy --------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.example.com;

    ssl_certificate     /etc/letsencrypt/live/rag.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Must exceed MAX_UPLOAD_BYTES (default 25 MB) or uploads 413 at the edge.
    client_max_body_size 30m;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # App + static frontend. Long timeouts + buffering off so chat SSE
    # (/lawfirm-chat-stream) and section generation stream token-by-token.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;        # REQUIRED for Server-Sent Events
        proxy_read_timeout 300s;    # SSE + slow LLM calls
        proxy_send_timeout 300s;
    }

    # Ingest worker routes (Drive webhook / manual re-ingest). Uncomment if you
    # run deploy/oci/lawfirm-rag-worker.service. Set a strong
    # INGEST_WORKER_TOKEN in .env and restrict /ingest/manual to your IP/ops net.
    # location /drive/webhook {
    #     proxy_pass http://127.0.0.1:8001;
    #     proxy_set_header Host            $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
    # location /ingest/manual {
    #     proxy_pass http://127.0.0.1:8001;
    #     proxy_set_header Host            $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     # allow 203.0.113.10; deny all;
    # }
}
