# Render Blueprint — free web service. Secrets are NOT here: paste your .env
# into the service's Environment tab ("Add from .env"); it must include
# REMOTE_EMBED_URL=https://api.fireworks.ai/inference/v1 + REMOTE_EMBED_KEY
# so embeddings run via API (no torch, fits 512MB).
# Free instances sleep after 15 min idle — point a free UptimeRobot monitor
# at /healthz every 5 min to keep it awake.
services:
  - type: web
    name: lawfirm-rag
    runtime: python
    plan: free
    rootDir: lawfirm-rag
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
